    <script>
      (() => {
        const navigationEntries =
          window.performance?.getEntriesByType?.("navigation") ?? [];
        const navigationEntry = navigationEntries[0];
        const legacyNavigation = window.performance?.navigation;
        const isReload =
          navigationEntry?.type === "reload" ||
          legacyNavigation?.type === legacyNavigation?.TYPE_RELOAD;
        const isHomePath = /^\/(?:index\.html)?$/.test(
          window.location.pathname,
        );

        if (!isReload || !isHomePath) return;

        const previousRestoration = window.history.scrollRestoration;
        window.history.scrollRestoration = "manual";

        if (window.location.hash) {
          const cleanUrl = `${window.location.pathname}${window.location.search}`;
          window.history.replaceState(window.history.state, "", cleanUrl);
        }

        const resetScroll = () => window.scrollTo(0, 0);
        resetScroll();
        window.addEventListener(
          "pageshow",
          () => {
            resetScroll();
            window.requestAnimationFrame(() => {
              resetScroll();
              window.history.scrollRestoration = previousRestoration;
            });
          },
          { once: true },
        );
      })();
    </script>

    <script>

        try {
          const storedTheme = window.localStorage.getItem(
            "nepatech-dark-mode",

          const darkMode =
            storedTheme === null
              ? window.matchMedia?.("(prefers-color-scheme: dark)")?.matches

          if (darkMode) {
            document
              .querySelector("link[data-theme-favicon]")
              ?.setAttribute(

              );
